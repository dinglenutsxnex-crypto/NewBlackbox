name: Build HAMMERSCALE APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find ./app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HAMMERSCALE-debug
          path: artifacts/*debug*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HAMMERSCALE-release
          path: artifacts/*release*.apk
          retention-days: 30

      - name: Upload All APKs (universal)
        uses: actions/upload-artifact@v4
        with:
          name: HAMMERSCALE-all-apks
          path: artifacts/
          retention-days: 30
